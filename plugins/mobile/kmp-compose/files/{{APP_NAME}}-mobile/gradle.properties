org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.multiplatform.enableDefaultHierarchyTemplate=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Daemon & Compiler Execution Safeguards
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
kotlin.compiler.execution.strategy=in-process
