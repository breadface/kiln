services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: always

configs:
  caddyfile:
    file: ./Caddyfile

volumes:
  caddy_data: {}
  caddy_config: {}
