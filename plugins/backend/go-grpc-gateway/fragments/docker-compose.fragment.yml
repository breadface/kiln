services:
  {{SERVICE_NAME}}:
    build:
      context: ./{{APP_NAME}}-api
      dockerfile: Dockerfile
    container_name: {{SERVICE_NAME}}
    dns: ["8.8.8.8", "1.1.1.1"]
    # Every env@1 variable is added here too, by bindings/env/.
    environment:
      GRPC_PORT: "{{GRPC_PORT}}"
    expose: ["{{PORT}}"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:{{PORT}}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
