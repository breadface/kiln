name: go-grpc-gateway
kind: backend
version: 0.1.0
description: >-
  Go API starter built proto-first: buf/protoc generate Go stubs from
  proto/, a real grpc.Server implements them, and grpc-gateway's ServeMux
  proxies REST/JSON to it over a single exposed port. Same Postgres+gorm,
  env config, and Connect/Migrate split as backend/go-api, but every
  request goes through gRPC rather than hand-rolled net/http routing. The
  buf.gen.yaml this plugin ships has a marker other language plugins can
  extend (see plugins/README.md) — kmp-compose targets it for its own
  Kotlin stubs.

placeholders:
  - name: MODULE_PATH
    description: "Go module path for the generated API, e.g. github.com/you/myapp-api"
    required: true
  - name: PORT
    description: Public HTTP port the REST gateway listens on
    default: "8080"
  - name: GRPC_PORT
    description: >-
      Internal gRPC port the gateway dials in process — never exposed
      outside the container/host
    default: "9090"

post_copy: hooks/post_copy.sh
contributes_go_module: true
