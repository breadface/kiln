name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./{{APP_NAME}}-api
          push: true
          tags: |
            ghcr.io/{{GHCR_OWNER}}/{{SERVICE_NAME}}:${{ github.sha }}
            ghcr.io/{{GHCR_OWNER}}/{{SERVICE_NAME}}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/{{STACK_NAME}}

            cat > .env <<'ENVEOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            ENVEOF

            docker swarm init >/dev/null 2>&1 || true

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            IMAGE_TAG="${{ github.sha }}"

            docker config inspect "caddyfile_$IMAGE_TAG" >/dev/null 2>&1 || \
              docker config create "caddyfile_$IMAGE_TAG" ./Caddyfile

            # Pull with retry — GHCR can take a moment to propagate a
            # freshly pushed image.
            for i in 1 2 3 4 5; do
              docker pull "ghcr.io/{{GHCR_OWNER}}/{{SERVICE_NAME}}:$IMAGE_TAG" && break
              echo "pull attempt $i failed, retrying..."
              sleep 5
            done

            echo "=== Running migrations ==="
            docker run --rm \
              --env-file .env \
              "ghcr.io/{{GHCR_OWNER}}/{{SERVICE_NAME}}:$IMAGE_TAG" \
              ./api-server -migrate

            echo "=== Deploying stack ==="
            for i in 1 2 3; do
              {{SERVICE_NAME_UPPER}}_TAG=$IMAGE_TAG IMAGE_TAG=$IMAGE_TAG docker stack deploy \
                --with-registry-auth \
                --prune \
                -c docker-compose.yml \
                -c docker-compose.swarm.yml \
                {{STACK_NAME}} && break
              echo "stack deploy attempt $i failed, retrying..."
              sleep 5
            done

            echo "=== Verifying rollout ==="
            service="{{STACK_NAME}}_{{SERVICE_NAME}}"
            converged=""
            for i in $(seq 1 20); do
              states=$(docker service ps "$service" --filter "desired-state=running" --format '{{.CurrentState}}' 2>/dev/null || true)
              if [ -n "$states" ] && ! echo "$states" | grep -qv '^Running'; then
                converged=1
                break
              fi
              sleep 3
            done
            if [ -z "$converged" ]; then
              echo "rollout did not converge for $service in time" >&2
              docker service ps "$service" || true
              exit 1
            fi
            echo "rollout complete: $service"

            docker image prune -f
