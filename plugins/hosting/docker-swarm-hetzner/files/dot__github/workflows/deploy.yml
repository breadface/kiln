name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # kiln:insert build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/{{STACK_NAME}}

            cat > .env <<'ENVEOF'
            # kiln:insert env
            ENVEOF

            docker swarm init >/dev/null 2>&1 || true

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            IMAGE_TAG="${{ github.sha }}"

            docker config inspect "caddyfile_$IMAGE_TAG" >/dev/null 2>&1 || \
              docker config create "caddyfile_$IMAGE_TAG" ./Caddyfile

            # Pull with retry — GHCR can take a moment to propagate a
            # freshly pushed image.
            # kiln:insert pull

            # kiln:insert migrate

            echo "=== Deploying stack ==="
            for i in 1 2 3; do
              IMAGE_TAG=$IMAGE_TAG docker stack deploy \
                --with-registry-auth \
                --prune \
                -c docker-compose.yml \
                -c docker-compose.swarm.yml \
                {{STACK_NAME}} && break
              echo "stack deploy attempt $i failed, retrying..."
              sleep 5
            done

            echo "=== Verifying rollout ==="
            # kiln:insert verify

            docker image prune -f
