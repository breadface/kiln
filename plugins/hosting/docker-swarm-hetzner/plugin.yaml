name: docker-swarm-hetzner
kind: hosting
version: 0.2.0
description: >-
  Self-hosted deploy: GitHub Actions builds and pushes every service to
  GHCR, a Hetzner (or any) VPS running Docker Swarm pulls and rolls out,
  and Caddy fronts everything with automatic TLS. Knows nothing about any
  particular backend — it builds, migrates, deploys, and routes to whatever
  provides http-service@1, migration@1, and env@1.

placeholders:
  - name: DOMAIN
    description: Primary domain Caddy will serve and get a TLS certificate for
    required: true
    flag: domain
  - name: ADMIN_EMAIL
    description: Email Caddy registers with its ACME/TLS certificate authority
    required: true
    flag: admin-email
  - name: GHCR_OWNER
    description: "GHCR namespace to push images to, e.g. your GitHub username or org"
    required: true
    flag: ghcr-owner
    derive:
      from: MODULE_PATH
      match: '^github\.com/([^/]+)/'
      template: "$1"
  - name: STACK_NAME
    description: Docker Swarm stack name
    default: "{{APP_NAME}}"

consumes:
  - contract: http-service@1
    min: 1
  - contract: migration@1
  - contract: env@1

executable:
  - "deploy.sh"
