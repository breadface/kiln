name: Deploy

on:
  workflow_dispatch:

# Never cancel a deploy halfway through; queue the next one instead.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: {{REGISTRY_HOST}}
          username: {{REGISTRY_USERNAME}}
          password: ${{ secrets.{{REGISTRY_PASSWORD_SECRET}} }}

      # kiln:insert build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: {{REGISTRY_HOST}}
          username: {{REGISTRY_USERNAME}}
          password: ${{ secrets.{{REGISTRY_PASSWORD_SECRET}} }}

      # Secrets arrive as environment variables, never pasted into the
      # script, so their values can't break or inject into it.
      - name: Write .env
        env:
          ENV_FILE: .env
          # kiln:insert env-vars
        run: |
          {
            : # valid even when nothing provides env@1
            # kiln:insert env-lines
          } >"$ENV_FILE"

      - name: Deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
          # kiln:insert secrets
        run: {{DEPLOY_COMMAND}}
