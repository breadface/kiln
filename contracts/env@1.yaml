name: env
version: 1
description: >-
  One environment variable the application reads at runtime. CI plugins
  turn every env@1 into a secret written to .env on deploy, and backends
  pass every env@1 into their container, so a plugin that adds a variable
  (e.g. a payment provider's API key) never edits either.
fields:
  - name: ENV_NAME
    description: Variable name, e.g. DATABASE_URL.
    required: true
  - name: ENV_DESCRIPTION
    description: What the value is and where to get it.
    default: ""
  - name: ENV_DEFAULT
    description: Value to use when it's unset, e.g. in local development; empty for none.
    default: ""
