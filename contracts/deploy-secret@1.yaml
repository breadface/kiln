name: deploy-secret
version: 1
description: >-
  A secret the deploy-target@1 command needs (credentials, hostnames) —
  as opposed to env@1, which the application itself reads at runtime. CI
  plugins export it as an environment variable of the same name.
fields:
  - name: SECRET_NAME
    description: Environment variable / CI secret name, e.g. DEPLOY_HOST.
    required: true
  - name: SECRET_DESCRIPTION
    description: What the value is, where to get it, and whether it's optional.
    default: ""
